/* Chitrakatha premium polish — visual-only, offline-safe, no layout or workflow changes */
:root{
  --silver:#c9cbd0;
  --silver-soft:#8f939b;
  --gold:#cfb16f;
  --gold2:#f0dba7;
  --line:#393a3b;
  --muted:#b4b1a9;
  --white:#f6f3ec;
  color-scheme:dark;
}
body{
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing:.08px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.brandname,.hello,.section-head h2,.stat strong,.cal-top strong,.avatar{
  font-family:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  text-shadow:0 1px 12px #e4cd9510;
}
.brandname{font-size:18px;letter-spacing:.45px}
.brandname small{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:10px;letter-spacing:2px}
.eyebrow{letter-spacing:2.15px;color:#e2c783}
.sub,.meta,.hint,.smallnote,.field label{color:#bbb8b0}
.card,.fold,.calendar,.day-fold,.team-fold,.stat,.iconbtn{
  border-color:color-mix(in srgb,var(--silver) 17%,var(--line));
  box-shadow:inset 0 1px 0 #ffffff08;
}
.hero{
  border-color:#77633c;
  background:linear-gradient(132deg,#302919 0%,#1b1a16 54%,#111211 100%);
  box-shadow:inset 0 1px 0 #ffffff13,0 12px 34px #0005;
}
.hero:after{border-color:#d6bb7b44;box-shadow:0 0 0 18px #c8a96a0a,0 0 0 38px #c8a96a06}
.btn{
  background:linear-gradient(145deg,#f0dba7 0%,#d0b16d 46%,#b9944d 100%);
  border-color:#e8d29a;
  box-shadow:inset 0 1px 0 #fff7d7a6,0 3px 12px #c8a96a13;
  transition:transform .18s ease,filter .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.btn.secondary,.textbtn{color:#ead6a2}
.btn.secondary{border-color:#8b7548;box-shadow:inset 0 1px 0 #ffffff0a}
.btn.ghost,.iconbtn{
  border-color:#51545a;
  box-shadow:inset 0 1px 0 #ffffff0a;
}
button,.chip,.fold>summary,.day-fold>summary,.team-fold>summary,.nav button{
  -webkit-tap-highlight-color:transparent;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .18s ease,filter .2s ease;
}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:2px solid var(--silver);outline-offset:3px;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:#c7b078;
  box-shadow:0 0 0 3px #c8a96a18,inset 0 1px 0 #ffffff08;
}
.card,.stat,.hero,.fold,.calendar,.day-fold,.team-fold{transition:border-color .22s ease,box-shadow .22s ease}
.pill{border-color:#77705d;color:#e6d5a9;background:linear-gradient(120deg,#c8a96a0c,#c9cbd008)}
.chip.active,.nav button.active{
  border-color:#8b7548;
  background:linear-gradient(135deg,#3b3220,#24231f);
  box-shadow:inset 0 1px 0 #ffffff0b;
}
.iconbtn{color:#e6d6af}
.avatar{border-color:#8b7548;background:linear-gradient(145deg,#4a402b,#292a2b);box-shadow:inset 0 1px 0 #ffffff10}
.day.booked:after{border-color:#d9787c}
.day.today{box-shadow:inset 0 0 0 1px #c8a96a50}
.toast{box-shadow:0 8px 26px #0009,inset 0 1px 0 #fff7d7}
@media(hover:hover){
  .btn:hover,.iconbtn:hover,.chip:hover{filter:brightness(1.08)}
  .btn:hover{box-shadow:inset 0 1px 0 #fff9d9,0 5px 17px #c8a96a20}
  .card:hover,.stat:hover{border-color:#6d634b}
}
@media(hover:none){button:active,.chip:active,.nav button:active{transform:scale(.985);filter:brightness(1.08)}}
/* Gentle page entrance and camera-like soft glint; no GIFs, libraries, or network fonts. */
main{animation:studioEnter .32s ease-out both}
.mark{position:relative;overflow:hidden;box-shadow:inset 0 1px 0 #ffffff20,0 0 18px #c8a96a0a}
.mark:after{content:"";position:absolute;inset:-60% auto -60% -70%;width:35%;transform:rotate(24deg);background:linear-gradient(90deg,transparent,#ffffff2b,transparent);animation:markGlint 7s ease-in-out infinite}
@keyframes studioEnter{from{opacity:.72;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes markGlint{0%,72%,100%{left:-70%}82%{left:140%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}


/* Deployment team layout refinement only: swipeable side-by-side teams and clearer assignment rows */
.dual-team-rail{display:flex;gap:12px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 -2px 8px;-webkit-overflow-scrolling:touch}
.dual-team-rail>.team-block{flex:0 0 min(88%,390px);min-width:0;scroll-snap-align:start;margin:8px 0}
.dual-team-rail>.team-block .team-fold-body{padding:0 10px 12px}
.team-block .team-fold>summary{line-height:1.35}
.freelancer-assignment{border:0;border-bottom:1px solid #39372f;border-radius:0;padding:7px 0;margin:0;background:transparent}
.freelancer-assignment .title{color:var(--gold2);margin-bottom:5px;font-size:11px}
.assignment-pair{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:8px;align-items:start}
.assignment-pair .field{min-width:0;margin:6px 0}
.assignment-pair .field label{font-size:11px;line-height:1.35;min-height:27px}
.freelancer-assignment .field input,.freelancer-assignment .field select{padding:8px 6px;font-size:11px;min-width:0}
.freelancer-assignment .payment-field{margin:0;min-width:0}
.freelancer-assignment .payment-field label{min-height:0}
.team-count-field{margin:8px 0 12px}
@media(max-width:360px){.dual-team-rail>.team-block{flex-basis:92%}.assignment-pair{grid-template-columns:1fr 1fr;gap:6px}}
.shift-card{border:1px solid #48412f;border-radius:12px;padding:11px;margin:10px 0;background:linear-gradient(145deg,#10100e,#090909)}.shift-card .title{color:var(--gold2);margin-bottom:8px}.shift-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shift-grid .field{min-width:0;margin:6px 0}.shift-grid input,.shift-grid select{min-width:0;width:100%;box-sizing:border-box}.shift-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.shift-remove{color:#c8c2b5;border:1px solid #454138;background:transparent;border-radius:9px;padding:7px 10px;font-size:12px}

/* Compact glance view + progressive detail disclosure */
.quick-day{padding:6px 0;border-top:1px solid #292820;line-height:1.35}
.quick-day:first-child{margin-top:5px}
.quick-deployment{padding:11px 12px;margin-bottom:8px}
.quick-deployment .quick-day .meta{font-size:11px;line-height:1.35}
.quick-deployment .quick-names{font-size:11px;margin-top:2px}
.quick-deployment .quick-actions{border-top:0;padding-top:5px;margin-top:2px}
.editor-assignment-row{display:grid;grid-template-columns:34px minmax(0,1.25fr) minmax(0,1fr);gap:7px;align-items:end;padding:5px 0;border:0;border-bottom:1px solid #24231f;border-radius:0;margin:0;background:transparent}
.editor-assignment-row .field{margin:4px 0}
.editor-assignment-row .field label{font-size:10px;margin-bottom:4px}
.editor-assignment-row .field input,.editor-assignment-row .field select{padding:9px 7px;font-size:12px;min-width:0}
.editor-assignment-row .pay-field{display:none}
.editor-assignment-row .remove-member{height:38px;width:34px;border:1px solid #59413d;border-radius:9px;background:#1a1110;color:#e6a6a0;font-size:17px}
.editor-team-slide{padding:10px;border-radius:12px}
.editor-team-slides{gap:8px}
.edit-days-track{gap:10px}
.quickview-slide{scroll-snap-align:start}
.quick-day>b{color:var(--gold2);font-size:13px}
.quick-place{margin-top:3px}
.quick-names{margin-top:4px;color:var(--gold2);font-size:12px;font-weight:650;overflow-wrap:anywhere}
.quick-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid #343229;padding-top:10px;margin-top:6px}
.edit-day-fold>summary{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.edit-day-fold>summary small{display:block;color:var(--muted);font-weight:400;font-size:11px;line-height:1.45;margin-top:4px;padding-right:18px}
.edit-day-fold[open]>.team-fold-body{padding-top:8px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

/* Calendar quick-view: fixed date header + horizontal panels, no vertical detail dump */
.quickview-backdrop{position:fixed;inset:0;z-index:50;background:#000d;display:flex;align-items:flex-end;justify-content:center;padding:0}
.quickview{width:min(520px,100%);max-height:88dvh;background:#090908;border:1px solid #6b5935;border-radius:22px 22px 0 0;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 -12px 48px #0009}
.quickview-head{padding:16px 18px 12px;background:#0b0b09;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex:none}
.quickview-date{font:24px Georgia,serif;color:var(--gold2)}.quickview-sub{font-size:12px;color:var(--muted);margin-top:4px}
.quickview-track{display:flex;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:#77633c #111;flex:1;min-height:0}
.quickview-slide{flex:0 0 100%;width:100%;scroll-snap-align:start;padding:16px;overflow-y:auto;max-height:calc(88dvh - 100px)}
.quickview-ritual{font:20px Georgia,serif;color:var(--white);margin-bottom:5px}.quickview-location{color:var(--muted);font-size:12px;margin-bottom:14px}
.quickview-team-title{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold2);margin:13px 0 9px}
.quickview-people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quickview-person{text-align:center;min-width:0}.quickview-portrait{width:68px;height:76px;margin:0 auto 7px;border-radius:19px 19px 13px 13px;background:linear-gradient(145deg,#665536,#22211d 70%);border:1px solid #9b8050;display:grid;place-items:center;color:#f0dba7;font:28px Georgia,serif;box-shadow:0 6px 16px #0008;overflow:hidden}
.quickview-person-name{font-size:12px;font-weight:700;overflow-wrap:anywhere}.quickview-role{font-size:10px;color:var(--muted);line-height:1.35;margin-top:3px;overflow-wrap:anywhere}
.quickview-footer{padding:9px 16px 15px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:8px;flex:none}.quickview-close{border:1px solid var(--line);border-radius:10px;color:var(--gold2);background:#181712;padding:8px 11px}
.quickview-empty{color:var(--muted);font-size:12px;padding:10px 0}

<script>
const people=[
{name:"Debraj Roy",role:"Candid Photographer",initial:"D",camera:"Nikon Z5II",gear:"Lenses: 24–70 f/4, 28–75 f/2.8, 85 f/1.8, 24 f/1.8\nLighting: Godox V1N, AD200 Pro, Godox X2T"},
{name:"Upasak Mukherjee",role:"Cinematographer / Photographer",initial:"U",camera:"Sony a7 IV",gear:"Lenses: 28 f/2, 35 f/1.4, 50 f/1.8, 85 f/1.8\nSupport: DJI Ronin RS4\nLighting & accessories: Godox TTL685, Godox X1, LC500R, SIMPEX RGB Light, KODAK 225V, Kodak Gobo torch, Haida ND"},
{name:"Rudra Pratap Sen",role:"Candid Photographer",initial:"R",camera:"Canon EOS R6 / 200D secondary",gear:"Lenses: RF 28–70 f/2.8, RF 16 f/2.8, EF 85 f/1.8, EF 50 f/1.8, Sigma Art 35 f/1.4\nLighting: Godox 860iii, TT520, X1, LC 500R, Honeycomb Octasoftbox 85cm, Kodak ND filter\nSupport: DJI Ronin RS3"},
{name:"Deep Shekhar",role:"Traditional Photographer",initial:"D",camera:"Nikon Zf",gear:"Lenses: 24–70 f/4, 50 f/1.8\nLighting: Godox V1N"}];
const bengali={"2026-11":[20,21,24,25],"2026-12":[2,3,4,12],"2027-01":[14,15,18,24,26,31],"2027-02":[2,3,9,10,11,14,15,21,22,25,26,27,28],"2027-03":[1,2,3,4,10,11,14,15],"2027-04":[18,19,21,23,24,25,26,27,28],"2027-05":[3,4,7,8,9,13,16,17,23,24,30,31],"2027-06":[1,5,9,10,13,16,17,21,26,27,28],"2027-07":[7,9,11,12,14,15,16],"2027-11":[10,11,15,16,20,21,22,23,24,25,26,28,29],"2027-12":[2,3,5,7,8,9,11,12,13,14]};
const STORE_KEY="chitrakatha_studio_os_v46";
const LEGACY_STORE_KEYS=["chitrakatha_studio_os_v45","chitrakatha_studio_os_v44","chitrakatha_studio_os_v43","chitrakatha_studio_os_v42","chitrakatha_studio_os_v41","chitrakatha_studio_os_v40","chitrakatha_studio_os_v39","chitrakatha_studio_os_v1"];
function loadSavedState(){try{const current=localStorage.getItem(STORE_KEY);let state=current?JSON.parse(current):null;if(!state){for(const key of LEGACY_STORE_KEYS){const raw=localStorage.getItem(key);if(raw){state=JSON.parse(raw);break;}}}if(!state||typeof state!=="object")state={};state.deployments=Array.isArray(state.deployments)?state.deployments.filter(d=>!isDemoDeployment(d)):[];localStorage.setItem(STORE_KEY,JSON.stringify(state));return state;}catch(_){return {}}}
const savedState=loadSavedState();
function persistState(){try{localStorage.setItem(STORE_KEY,JSON.stringify({deployments,offers,unavailableDates,gearChecks,gearMissing,gearAudit,gearConfirmed,version:4,radarImports,updatedAt:new Date().toISOString()}))}catch(_){toast("Could not save on this device. Check browser storage settings.")}}
function isDemoDeployment(d){const client=String(d?.client||d?.title||d?.name||'').trim().toLowerCase().replace(/\s+/g,' ');return /^demo(?:\s*[·:-]|$)/i.test(client)||['ankit & riya','amit & shreya'].includes(client)||d?.demo===true||d?.isDemo===true||d?.isDemoData===true;}
let page="home",month=new Date(2026,9,1),seasonFilter="both",calendarPerson="Everyone in Chitrakatha",offerViewer=people[0]?.name||"",radarImports=Array.isArray(savedState.radarImports)?savedState.radarImports:[],deploymentStatsOpen=false,offerStatsOpen=false,deployments=Array.isArray(savedState.deployments)?savedState.deployments.filter(d=>!isDemoDeployment(d)):[],offers=Array.isArray(savedState.offers)?savedState.offers:[],unavailableDates=Array.isArray(savedState.unavailableDates)?savedState.unavailableDates:[],draftAssignments=0,draftDayCount=0;
let gearChecks=savedState.gearChecks&&typeof savedState.gearChecks==="object"?savedState.gearChecks:{before:{},after:{}};
// Remove known prototype-only sample deployments from this browser storage as well as the in-memory list.
if(Array.isArray(savedState.deployments)&&deployments.length!==savedState.deployments.length){try{localStorage.setItem(STORE_KEY,JSON.stringify({...savedState,deployments,updatedAt:new Date().toISOString()}));}catch(_){}}
let gearMissing=savedState.gearMissing&&typeof savedState.gearMissing==="object"?savedState.gearMissing:{before:{},after:{}};
let gearAudit=Array.isArray(savedState.gearAudit)?savedState.gearAudit:[],gearConfirmed=savedState.gearConfirmed&&typeof savedState.gearConfirmed==="object"?savedState.gearConfirmed:{before:[],after:[]};
let gearViewer=people[0]?.name||"",gearPhase="current",gearSearch="";

const $=s=>document.querySelector(s);
function gearItems(){let list=[];people.forEach(p=>{const add=(name,category)=>{name=String(name||"").trim();if(!name)return;const id=(p.name+"|"+category+"|"+name).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");if(!list.some(x=>x.owner===p.name&&x.name.toLowerCase().replace(/[^a-z0-9]/g,'')===name.toLowerCase().replace(/[^a-z0-9]/g,'')))list.push({id,owner:p.name,name,category})};add(p.camera,"Camera body");String(p.gear||"").split("\n").forEach(line=>{let at=line.indexOf(":");if(at<0){add(line,"Other gear");return}let cat=line.slice(0,at).trim(),rest=line.slice(at+1);rest.split(",").forEach(item=>add(item,cat))})});return list}
function logGear(action,item,from,to){gearAudit.unshift({at:new Date().toISOString(),by:gearViewer,action,item:item?.name||"Equipment list",owner:item?.owner||"",from:from||"",to:to||""});gearAudit=gearAudit.slice(0,300)}
function gearHolder(item){return gearChecks.current?.[item.id]||gearChecks.after?.[item.id]||gearChecks.before?.[item.id]||""}
function gearMissingStatus(item){return false}
function setGearMissing(id,missing){const item=gearItems().find(x=>x.id===id);if(!item||item.owner!==gearViewer){toast("Only the owner can mark their item as can't find.");return}gearMissing.current=gearMissing.current||{};const holder=gearHolder(item);if(missing){gearMissing.current[id]=true;logGear("Marked can't find",item,holder,"Can't find")}else{delete gearMissing.current[id];logGear("Can't-find status cleared",item,"Can't find",holder)}persistState();render()}
function setGearCustody(id){const item=gearItems().find(x=>x.id===id);if(!item)return;gearChecks.current=gearChecks.current||{};const old=gearHolder(item);if(old===gearViewer){delete gearChecks.current[id];logGear("Custody released",item,old,"")}else{if(old&&old!==gearViewer){toast(`Already marked in ${old}'s custody. Ask them to release it first.`);render();return}gearChecks.current[id]=gearViewer;if(gearMissing.current)delete gearMissing.current[id];logGear("Custody marked",item,old,gearViewer)}persistState();render()}
function gearPage(){
 const items=gearItems(),query=gearSearch.trim().toLowerCase();
 const filtered=items.filter(x=>!query||(x.name+' '+x.category+' '+x.owner+' '+gearHolder(x)).toLowerCase().includes(query));
 const categories=[['Body',/camera body|body/i],['Lenses',/lens/i],['Lights & Accessories',/^(?!.*(?:camera body|body|lens)).*$/i]];

 const own=filtered.filter(x=>x.owner===gearViewer),held=filtered.filter(x=>gearHolder(x)===gearViewer&&x.owner!==gearViewer);

 return `<div class="eyebrow">MY TEAM</div><h1 class="hello">Gear details</h1><p class="sub">Choose a team member. Gear is grouped by Body, Lenses, and Lights & Accessories. Tap an item only when it is physically with you; the owner can check their list to see its current holder.</p>
 <div class="field"><label for="gearViewer">Team member (preview)</label><select id="gearViewer" onchange="gearViewer=this.value;render()">${people.map(p=>`<option value="${esc(p.name)}" ${p.name===gearViewer?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
 <div class="field"><label for="gearSearch">Find equipment</label><input id="gearSearch" type="search" value="${esc(gearSearch)}" placeholder="Search a body, lens, light or accessory…" oninput="gearSearch=this.value;const main=document.querySelector('#main');main.innerHTML=gearPage();const input=document.querySelector('#gearSearch');input.focus();input.setSelectionRange(input.value.length,input.value.length)"></div>

 ${held.length?`<div class="gear-owner-detail" style="margin-top:10px"><strong>Other people’s gear currently with ${esc(gearViewer)}</strong>${groups(held)}</div>`:''}

}

 const assigned=sideTagged && /groom|bride/.test(requestedSide)
   ? allAssigned.filter(a=>String(a.side||'').toLowerCase().replace(/[-_]/g,' ').includes(requestedSide.includes('groom')?'groom':'bride'))

 const uniqueAssigned=[...new Map(assigned.map(a=>[a.member,a])).values()];
 const dateLabel=fmtDate(dt);const roleNames=uniqueAssigned.map(a=>`${esc(a.member)}${a.role?' · '+esc(a.role):''}`).join(' • ');

 const sides=[...new Set(plans.map(p=>String(p.side||'').trim()).filter(Boolean))];const isBoth=/both/i.test(String(d.side||'')) || (sides.some(x=>/groom/i.test(x))&&sides.some(x=>/bride/i.test(x)));
 const displaySide=isBoth ? (requestedSide.includes('groom')?'BOTH SIDES · GROOM’S SIDE':requestedSide.includes('bride')?'BOTH SIDES · BRIDE’S SIDE':'BOTH SIDES') : (d.side|| (sides.length>1?'Both sides':(chosen.side||side||d.type||'Event')));

 return `<article class="cine-date-slide" style="--cine-backdrop:${backdrop}"><div class="cine-top"><div><div class="cine-date">${esc(dateLabel)} · ${esc(d.client||'Deployment')}</div><h1 class="cine-title">${esc(kind)}</h1><div class="cine-sub">${esc(displaySide)}</div></div></div><div class="cine-details">${time?`<div class="cine-detail"><b>Call time</b>${esc(time)}</div>`:''}${location?`<div class="cine-detail"><b>Venue</b>${esc(location)}</div>`:''}<div class="cine-detail"><b>Deployment</b>${esc(d.client||'Client not specified')} · ${esc(d.type||'Work')}${d.type==='Wedding'?' · '+esc(displaySide):''}</div>${chosen.ritual?`<div class="cine-detail"><b>Ritual</b>${esc(chosen.ritual)}</div>`:''}${chosen.details?`<div class="cine-detail"><b>Details</b>${esc(chosen.details)}</div>`:''}${roleNames?`<div class="cine-detail"><b>Assigned team</b>${roleNames}</div>`:''}</div><div class="cine-crew-title">THE CREW</div><div class="cine-crew">${crew||'<div class="cine-detail">No freelancers assigned to this work.</div>'}</div>${notes.length?`<div class="cine-note"><b>NOTES</b><br>${notes.map(esc).join('<br>')}</div>`:''}</article>`;
}
function openCinematicDate(dt,workList,preferredIndex=null,side=''){
 const valid=(workList||[]).map(d=>({d,index:deployments.indexOf(d)})).filter(x=>x.index>=0&&(x.d.days||[]).some(day=>day.date===dt));
 if(!valid.length){toast('No work details found for this date.');return;}
 closeCinematicWork();closeCalendarQuickView();
 const sceneList=[];
 valid.forEach(x=>{
   const day=(x.d.days||[]).find(y=>y.date===dt);const plans=day?.plans||[];
   const labels=[...new Set(plans.map(p=>String(p.side||'').trim()).filter(Boolean))];
   const both=/both/i.test(String(x.d.side||'')) || (labels.some(v=>/groom/i.test(v))&&labels.some(v=>/bride/i.test(v)));
   if(both){
     const sides=['Groom-side','Bride-side'];
     sides.forEach(s=>sceneList.push({index:x.index,side:s,d:x.d}));
   }else sceneList.push({index:x.index,side:(preferredIndex===x.index&&side)?side:(labels[0]||x.d.side||''),d:x.d});
 });
 const first=sceneList[0];
 const modal=document.createElement('section');modal.className='cinematic-overlay';modal.id='cinematicEventOverlay';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.setAttribute('aria-label','Cinematic event details');
 const firstDay=(first.d.days||[]).find(x=>x.date===dt);const firstPlan=(firstDay?.plans||[]).find(p=>String(p.side||'').toLowerCase().includes(String(first.side||'').toLowerCase().split('-')[0]))||(firstDay?.plans||[])[0]||{};
 modal.style.setProperty('--cine-backdrop',cineBackdropFor(firstPlan.kind,first.d.type,first.side));
 const slides=sceneList.map(x=>cinematicSlideMarkup(x.index,dt,x.side));
 modal.innerHTML=`<button class="cine-close" onclick="closeCinematicWork()" aria-label="Close cinematic view">×</button><div class="cine-date-track" id="cineDateTrack">${slides.join('')}</div>${sceneList.length>1?`<div class="cine-slide-count" id="cineSlideCount">1 / ${sceneList.length} · Swipe for other works or side</div>`:''}`;
 document.body.appendChild(modal);document.body.style.overflow='hidden';
 const track=modal.querySelector('#cineDateTrack'),count=modal.querySelector('#cineSlideCount');
 if(preferredIndex!==null){let target=sceneList.findIndex(x=>x.index===preferredIndex&&(!side||String(x.side).toLowerCase().includes(String(side).toLowerCase().split(' ')[0])));if(target<0)target=sceneList.findIndex(x=>x.index===preferredIndex);if(target>0)track.scrollLeft=target*track.clientWidth;}
 if(count)track.addEventListener('scroll',()=>{const i=Math.min(sceneList.length-1,Math.round(track.scrollLeft/Math.max(1,track.clientWidth)));count.textContent=`${i+1} / ${sceneList.length} · Swipe for other works or side`},{passive:true});
}

ath.max(0,(Number(d.finances?.clientTotal)||0)-(Number(d.finances?.advance)||0)),0).toLocaleString('en-IN')}</strong><span>Client balance to collect</span></div></div><div class="stats"><div class="stat"><strong>₹${total.toLocaleString('en-IN')}</strong><span>Total freelancer payments offered</span></div><div class="stat"><strong>₹${totalAdvance.toLocaleString('en-IN')}</strong><span>Total freelancer advances paid</span></div><div class="stat"><strong>₹${totalBalance.toLocaleString('en-IN')}</strong><span>Freelancer balance to pay</span></div></div><p class="hint">Financial totals are calculated from entered client totals and individual freelancer payout amounts. Coverage days and repeated freelancer assignments are not counted as separate works.</p></div></details>${(()=>{const clientRows=deployments.filter(d=>d.finances&&String(d.finances.clientTotal??'').trim()!==''&&Number.isFinite(Number(d.finances.clientTotal))).map(d=>({d,total:Number(d.finances.clientTotal)||0,advance:Number(d.finances.advance)||0,balance:Math.max(0,(Number(d.finances.clientTotal)||0)-(Number(d.finances.advance)||0))}));const ct=clientRows.reduce((n,x)=>n+x.total,0),ca=clientRows.reduce((n,x)=>n+x.advance,0),cb=clientRows.reduce((n,x)=>n+x.balance,0);return clientRows.length?`<details class="fold"><summary>Client finance overview · ₹${ct.toLocaleString('en-IN')}</summary><div class="fold-body"><div class="stats"><div class="stat"><strong>₹${ct.toLocaleString('en-IN')}</strong><span>Total agreed from clients</span></div><div class="stat"><strong>₹${ca.toLocaleString('en-IN')}</strong><span>Total client advances received</span></div><div class="stat"><strong>₹${cb.toLocaleString('en-IN')}</strong><span>Total client balance due</span></div></div>${clientRows.map(x=>`<div class="work-detail-day"><b>${esc(x.d.client)} · ${esc(x.d.side||'Side not specified')}</b><div class="meta">${(x.d.days||[]).length} coverage day(s) · Agreed ₹${x.total.toLocaleString('en-IN')} · Advance received ₹${x.advance.toLocaleString('en-IN')} · Balance due ₹${x.balance.toLocaleString('en-IN')}</div></div>`).join('')}</div></details>`:'<div class="notice">Client finance overview will appear after a client total is entered.</div>'})()}${paid.length?`<details class="fold"><summary>Freelancer payment summary · ₹${total.toLocaleString('en-IN')}</summary><div class="fold-body"><div class="stats"><div class="stat"><strong>₹${total.toLocaleString('en-IN')}</strong><span>Total offered</span></div><div class="stat"><strong>₹${totalAdvance.toLocaleString('en-IN')}</strong><span>Total advances</span></div><div class="stat"><strong>₹${totalBalance.toLocaleString('en-IN')}</strong><span>Total balance</span></div></div><div class="meta">Freelancer payment entries: ${paid.length} · Assigned coverage days with payments recorded.</div>${deployments.map(d=>{const fs=(d.days||[]).flatMap(day=>(day.assignments||[]).filter(a=>a.member&&a.pay!==undefined&&String(a.pay).trim()!=='').map(a=>({day,a})));const t=fs.reduce((n,x)=>n+Number(x.a.pay||0),0),ad=fs.reduce((n,x)=>n+Number(x.a.advance||0),0);return `<div class="work-detail-day"><b>${esc(d.client)} · ${esc(d.side||((d.days||[]).some(day=>(day.plans||[]).some(p=>String(p.side||'').toLowerCase().includes('bride'))) && (d.days||[]).some(day=>(day.plans||[]).some(p=>String(p.side||'').toLowerCase().includes('groom')))?'Both sides':''))}</b><div class="meta">${fs.length} payment entry/entries · Offered ₹${t.toLocaleString('en-IN')} · Advance ₹${ad.toLocaleString('en-IN')} · Balance ₹${Math.max(0,t-ad).toLocaleString('en-IN')}</div></div>`}).join('')}${Object.entries(byPerson).map(([name,v])=>`<details class="day-fold"><summary>${esc(name)} · ${v.days.length} day(s)</summary><div class="day-body"><div class="meta">Offered: ₹${v.total.toLocaleString('en-IN')} · Advance: ₹${v.advance.toLocaleString('en-IN')} · Balance: ₹${Math.max(0,v.total-v.advance).toLocaleString('en-IN')}</div>${v.days.map(x=>`<div class="meta">${esc(fmtDate(x.date))} · ${esc(x.client)} · Offered ₹${x.amount.toLocaleString('en-IN')} · Advance ₹${x.advance.toLocaleString('en-IN')} · Balance ₹${Math.max(0,x.amount-x.advance).toLocaleString('en-IN')}</div>`).join('')}</div></details>`).join('')}<p class="hint">Only entered payout amounts are included. This local prototype does not enforce real account privacy.</p></div></details>`:'<div class="notice">Payout summary will appear here only after an individual freelancer payout is entered.</div>'}${deployments.length?deployments.map(deployCard).join(""):`<div class="empty">No deployments created on this device yet.</div>`}<div class="smallnote">This preview stores data on this device. Real deployer ownership and financial privacy require server-enforced permissions.</div>`}

function generateSchedule(){let a=$('#rangeStart').value,one=$('#oneDayWork')?.checked||false,b=one?a:$('#rangeEnd').value;if(one&&a)$('#rangeEnd').value=a;if(!a||(!one&&!b)){toast(one?'Choose the work date first.':'Choose both start and end dates first.');return}if(b<a){toast('End date must be on or after the start date.');return}let days=[],d=new Date(a+'T12:00:00'),last=new Date(b+'T12:00:00');while(d<=last){days.push(new Date(d));d.setDate(d.getDate()+1);if(days.length>45){toast('Please split coverage ranges longer than 45 days.');return}}draftDayCount=days.length;$('#eventDays').innerHTML=days.map((dt,i)=>eventDayCard(i+1,dt.toISOString().slice(0,10))).join('');}

function saveDeployment(e){
 e.preventDefault();let f=new FormData(e.target),days=[],conflicts=[];
 for(let i=1;i<=draftDayCount;i++){if(!f.get(`dayInclude${i}`))continue;let date=f.get(`dayDate${i}`);let wedding=$('#eventType').value==='Wedding',both=wedding&&$('#side').value==='Both sides';let plans=[];for(let key of (both?['groom','bride']:['shared'])){let kind=f.get(`day${i}_${key}Kind`)||'Event coverage',location=f.get(`day${i}_${key}Location`)||'',time=f.get(`day${i}_${key}Time`)||'';if(!String(location).trim()){toast(`Enter a location for ${fmtDate(date)} (${key==='groom'?'groom side':key==='bride'?'bride side':'ritual'}).`);return}plans.push({side:key==='groom'?'Groom-side':key==='bride'?'Bride-side':(wedding?$('#side').value:'Event'),kind,location,time,sameLocation:f.get(`day${i}_${key}SameLocation`)==='yes'});}let primary=plans[0];let day={date,time:primary.time,kind:primary.kind,location:primary.location,plans,note:f.get(`dayNote${i}`)||'',extra:f.get(`dayExtra${i}`)||'',assignments:[],shifts:[]};let shiftHost=$(`#shifts${i}`);if(shiftHost){shiftHost.querySelectorAll('.shift-card').forEach(card=>{let n=card.dataset.shift,prefix=`shift${i}_${n}`;let member=f.get(prefix+'Member')||'';day.shifts.push({name:f.get(prefix+'Name')||`Shift ${n}`,start:f.get(prefix+'Start')||'',end:f.get(prefix+'End')||'',location:f.get(prefix+'Location')||'',member,role:member?(f.get(prefix+'Role')||''):'',pay:member?(f.get(prefix+'Pay')||''):'',payStatus:member&&f.get(prefix+'Pay')?'Entered':'Not set',status:member?'Pending acceptance':'Unassigned'});});}
  document.querySelectorAll(`.team-block[data-team^="d${i}"]`).forEach(block=>{let key=block.dataset.team,count=Number(f.get(key+'Count')||1);for(let n=1;n<=count;n++){let member=f.get(key+'Member'+n);if(!member)continue;let a={member,role:f.get(key+'Role'+n)||'',pay:f.get(key+'Pay'+n)||'',payStatus:f.get(key+'Pay'+n)?'Entered':'Not set',status:'Pending acceptance',dailyNote:'',side:key.endsWith('g')?'Groom-side':key.endsWith('b')?'Bride-side':($('#eventType').value==='Wedding'?$('#side').value:'Event')};day.assignments.push(a);if(unavailableDates.some(x=>x.date===date))conflicts.push(`${member} · ${fmtDate(date)} (marked unavailable on this device)`);for(let old of deployments){for(let od of (old.days||[])){if(od.date===date&&(od.assignments||[]).some(x=>x.member===member))conflicts.push(`${member} · ${fmtDate(date)}`)}}}});days.push(day);
 }
 if(!days.length){toast('Include at least one work, break or travel day.');return}
 let clientTotal=f.get('clientTotal'),advance=f.get('advance');if(clientTotal!==''&&advance!==''&&Number(advance)>Number(clientTotal)){toast('Advance cannot exceed client total.');return}
 let d={client:f.get('client'),type:f.get('type'),side:f.get('type')==='Wedding'?f.get('side'):'',externalType:f.get('externalType')||'',names:f.get('type')==='Wedding'?f.get('names'):'',notes:f.get('deployerNotes')||'',date:days[0]?.date||'',days,assignments:days.reduce((n,x)=>n+x.assignments.length,0),status:conflicts.length?'Conflict review':'Draft',finances:{clientTotal:clientTotal||'',advance:advance||'',balance:clientTotal!==''?String(Math.max(0,Number(clientTotal||0)-Number(advance||0))):''},deliverables:{photos:f.get('photos'),album:f.get('album'),albumDetails:f.get('albumDetails')||'',video:f.get('video'),videoType:f.get('videoType')||'',notes:f.get('deliveryNotes')||''}};

 <p class="sub">Mark dates when you cannot accept studio assignments for personal work or other commitments.</p>
 <div class="card"><form onsubmit="event.preventDefault();addUnavailableDate()">
 <div class="field"><label for="unavailablePerson">Freelancer</label><select id="unavailablePerson" onchange="calendarPerson=this.value;render()">${people.map(p=>`<option value="${esc(p.name)}" ${p.name===who?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
 <div class="field"><label for="unavailableDate">Date you are unavailable (DD/MM/YYYY)</label><input id="unavailableDate" type="date" required></div>
 <div class="field"><label for="unavailableNote">Note (optional)</label><input id="unavailableNote" placeholder="Personal commitment (optional)"></div>
 <button class="btn" type="submit" style="width:100%">＋ Mark date unavailable</button>
 </form></div>
 <div class="notice">Your unavailable dates are intended to warn the deployer during conflict checks. They do not expose your private reason to other members.</div>
 <div class="section-head"><h2>Unavailable dates</h2></div>
 ${sorted.length?sorted.map(d=>{const rec=unavailableDates.find(x=>x&&typeof x==='object'&&x.member===who&&x.date===d);return `<div class="card row"><div class="grow"><div class="title">${esc(fmtDate(d))}</div><div class="meta">${esc(who)} · Unavailable for new assignments${rec?.note?` · ${esc(rec.note)}`:""}</div></div><button class="iconbtn" onclick="removeUnavailableDate('${esc(d)}','${esc(who)}')" aria-label="Remove unavailable date">×</button></div>`}).join(""):`<div class="empty">No unavailable dates marked for ${esc(who)} on this device.</div>`}
 <div class="smallnote">Prototype only: dates are stored in this page session and are not yet shared with the deployer or other devices.</div>`;
}
function addUnavailableDate(){
 const date=$("#unavailableDate")?.value;
 if(!date)return;
 const member=$("#unavailablePerson")?.value||calendarPerson;if(!unavailableDates.some(x=>x&&typeof x==='object'&&x.member===member&&x.date===date))unavailableDates.push({date,member,note:$("#unavailableNote")?.value.trim()||""});
 else toast("That date is already marked unavailable for this freelancer.");
 render();
}
function removeUnavailableDate(date,member){unavailableDates=unavailableDates.filter(x=>!(x&&typeof x==='object'&&x.date===date&&x.member===member));render()}

function radarAdminPage(){return `<div class="eyebrow">SUPER ADMIN · APP MANAGEMENT</div><h1 class="hello">Season Radar imports</h1><p class="sub">Add potential dates from Panjika/Panchang photos, pasted text, or informal notes. Imports remain unconfirmed planning markers, never bookings.</p><div class="notice"><b>Prototype limitation:</b> this screen is not protected by real authentication. Do not use real sensitive data. Photo OCR, bulk parsing, and secure admin authorization require the production backend.</div><div class="card"><form onsubmit="event.preventDefault();saveRadarImport()"><div class="field"><label for="radarSource">Source type</label><select id="radarSource"><option>Panjika / Panchang</option><option>Photographed diary / paper record</option><option>Pasted text</option><option>Word-of-mouth / informal lead</option><option>Historical deployment import</option></select></div><div class="field"><label for="radarSourceFile">Source photo or document (review only)</label><input id="radarSourceFile" type="file" accept="image/*,.pdf,.txt,.csv"></div><div class="field"><label for="radarImportText">Paste source text or extracted notes</label><textarea id="radarImportText" placeholder="Example: 21/11/2026 — potential Bengali wedding date; source noted in Panjika"></textarea></div><div class="field"><label for="radarDates">Potential dates (one per line, DD/MM/YYYY)</label><textarea id="radarDates" placeholder="21/11/2026
24/11/2026"></textarea></div><div class="field"><label for="radarOwner">Actual deployer / record owner (if known)</label><select id="radarOwner"><option value="">Unknown — leave unassigned</option>${people.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label for="radarImportNotes">Review notes / unreadable fields</label><textarea id="radarImportNotes" placeholder="Leave uncertain values blank; note what needs review"></textarea></div><button class="btn" type="submit" style="width:100%">Save import as unconfirmed</button></form></div><div class="section-head"><h2>Import review queue</h2><span class="pill">${radarImports.length} saved</span></div>${radarImports.length?radarImports.map((r,i)=>`<div class="card"><div class="row" style="justify-content:space-between"><strong>${esc(r.source)}</strong><span class="pill">Unconfirmed</span></div><div class="meta">Imported ${esc(r.at)} · Owner: ${esc(r.owner||'Unknown')} · ${r.dates.length} date(s)</div><div class="meta">${r.dates.map(esc).join(' · ')||'No dates parsed'}</div>${r.text?`<div class="meta">Source notes: ${esc(r.text)}</div>`:''}${r.notes?`<div class="meta">Review: ${esc(r.notes)}</div>`:''}</div>`).join(''):`<div class="empty">No imports yet. New dates will appear here for review.</div>`}<button class="btn ghost" style="width:100%" onclick="showPage('profile')">Back to profile</button>`}
function saveRadarImport(){const source=$('#radarSource')?.value||'Pasted text';const text=$('#radarImportText')?.value.trim()||'';const raw=$('#radarDates')?.value||'';const dates=raw.split(/\n|,|;/).map(x=>x.trim()).filter(Boolean);const owner=$('#radarOwner')?.value||'';const notes=$('#radarImportNotes')?.value.trim()||'';if(!text&&!dates.length&&!$('#radarSourceFile')?.files?.length){toast('Add source notes, dates, or a source file first.');return}radarImports.unshift({source,text,dates,owner,notes,at:new Date().toLocaleString('en-IN'),status:'Unconfirmed',fileName:$('#radarSourceFile')?.files?.[0]?.name||''});persistState();toast('Saved to local review queue as unconfirmed.');render()}
function profilePage(){return `<div class="eyebrow">YOUR ACCOUNT</div><h1 class="hello">Profile & access</h1><p class="sub">One Chitrakatha app, with access determined privately by the account's approved role.</p><div class="card"><div class="row"><div class="avatar">◉</div><div class="grow"><div class="title">Not signed in</div><div class="meta">Prototype mode · no account session</div></div><span class="pill">Preview</span></div><div class="separator"></div><button class="btn" style="width:100%" onclick="showPage('auth')">Sign in / Request access</button><button class="btn secondary" style="width:100%;margin-top:9px" onclick="showPage('availability')">Manage my unavailable dates</button><button class="btn ghost" style="width:100%;margin-top:9px" onclick="showPage('radarAdmin')">Super Admin · Season Radar imports (prototype)</button></div><div class="card"><div class="title">Private role-based access</div><div class="meta" style="margin-top:8px">• Everyone uses the same app and their own normal login.<br>• The Super Admin console appears only when the server verifies that account's Super Admin role; there is no separate public Super Admin login or status label.<br>• Other members cannot see or open the admin console.<br>• Super Admin has no access to financial records, including through backend operations.<br>• New accounts remain pending until approved; roles are assigned by the Super Admin.<br>• Members can propose profile or gear changes for approval.<br>• Only a deployment creator can see client totals and advances for their own deployments.</div></div><div class="smallnote">These are the agreed access rules. Real sign-in, shared availability, and server-enforced permissions require the backend build.</div>`}
function authPage(){return `<div class="eyebrow">PRIVATE STUDIO ACCESS</div><h1 class="hello">Welcome back.</h1><p class="sub">Prototype forms only — credentials are not sent or saved.</p><div class="card"><div class="tabs"><button class="chip active" onclick="authMode('login',this)">Sign in</button><button class="chip" onclick="authMode('signup',this)">Request access</button><button class="chip" onclick="authMode('reset',this)">Reset password</button></div><form onsubmit="event.preventDefault();toast('Authentication is not connected. No credentials were stored.')" id="authForm"><div id="authFields"><div class="field"><label>Email</label><input type="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input type="password" required placeholder="Do not use a real password"></div></div><button class="btn" style="width:100%" type="submit">Continue</button></form><div class="notice">Do not enter a real password. This is a visual prototype, not live authentication.</div></div><button class="btn ghost" style="width:100%" onclick="showPage('profile')">Back to profile</button>`}
function authMode(mode,el){document.querySelectorAll(".tabs .chip").forEach(x=>x.classList.remove("active"));el.classList.add("active");$("#authFields").innerHTML=mode==="reset"?`<div class="field"><label>Account email</label><input type="email" required placeholder="you@example.com"></div>`:mode==="signup"?`<div class="field"><label>Full name</label><input required placeholder="Your name"></div><div class="field"><label>Email</label><input type="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input type="password" required placeholder="Create password"></div><div class="field"><label>Confirm password</label><input type="password" required placeholder="Confirm password"></div><div class="field"><label>Professional role</label><input required placeholder="Your role"></div>`:`<div class="field"><label>Email</label><input type="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input type="password" required placeholder="Do not use a real password"></div>`}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.addEventListener('change',e=>{let m=e.target?.name?.match(/^d(\d+)[gbe](Member|Role|Pay)(\d+)$/);if(m)syncFollowingTeams(Number(m[1]));});
function render(){persistState();let m=$("#main");m.innerHTML=page==="home"?home():page==="myBookings"?myBookingsPage():page==="calendar"?calendarPage():page==="deployments"?deploymentsPage():page==="offers"?offersPage():page==="team"?teamPage():page==="new"?newPage():page==="profile"?profilePage():page==="availability"?availabilityPage():page==="auth"?authPage():page==="radarAdmin"?radarAdminPage():home();document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));if(page==="new"){addEventDay();toggleWeddingTeams()}}
// Delegated calendar interaction: event handlers survive full re-renders and support touch/keyboard.
document.addEventListener('click',function(e){const day=e.target.closest('[data-calendar-date]');if(day){e.preventDefault();const date=day.getAttribute('data-calendar-date');if(date)dayTap(date);}});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-calendar-date]')){e.preventDefault();const date=e.target.getAttribute('data-calendar-date');if(date)dayTap(date);}});
render();
</script></body></html>
