name: Chitrakatha Security Tests

on:
  workflow_dispatch:
  push:
    branches: [main, v53-security-review]
  pull_request:

permissions:
  contents: read

jobs:
  firestore-rules:
    name: Firestore security tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run Firestore emulator security tests
        run: npm test
